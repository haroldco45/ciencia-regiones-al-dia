[build]
  ignore = "git log -1 --pretty='%an %ae' | grep -qiE 'robot|github-actions'"  # no publicar commits del robot (ahorra créditos)

[[headers]]
  for = "/noticias.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
