name: Robot de noticias

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buscar noticias
        run: node scripts/robot.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot-vibras@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sin noticias nuevas"
          else
            git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') hora Colombia"
            git push
          fi
